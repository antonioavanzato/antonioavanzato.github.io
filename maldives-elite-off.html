<title>Maldives Elite — приложение временно отключено</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f1b1e;--card:#16262a;--gd:#c9b08a;--ink:#efe8dc;--mu:#9aa7a6;--tq:#00a9c4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Rubik,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:hidden;position:relative}
.glow{position:fixed;inset:-30%;background:radial-gradient(circle at 30% 20%,rgba(0,169,196,.16),transparent 45%),radial-gradient(circle at 75% 80%,rgba(201,176,138,.14),transparent 45%);animation:drift 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.05)}}
.wave{position:fixed;left:0;right:0;bottom:0;height:120px;opacity:.35;pointer-events:none}
.card{position:relative;width:100%;max-width:380px;text-align:center;padding:40px 28px 32px;border-radius:28px;background:linear-gradient(180deg,rgba(22,38,42,.92),rgba(15,27,30,.92));border:1px solid rgba(201,176,138,.22);box-shadow:0 30px 80px rgba(0,0,0,.45);animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.logo{width:150px;height:auto;margin:0 auto 22px;display:block;filter:drop-shadow(0 8px 24px rgba(201,176,138,.3))}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gd);margin-bottom:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gd);box-shadow:0 0 0 0 rgba(201,176,138,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(201,176,138,0)}100%{box-shadow:0 0 0 0 rgba(201,176,138,0)}}
h1{font-size:24px;line-height:1.25;font-weight:600;margin-bottom:12px}
p{font-size:15px;line-height:1.55;color:var(--mu)}
.en{margin-top:18px;padding-top:16px;border-top:1px solid rgba(239,232,220,.08);font-size:13px}
.btn{margin-top:26px;display:inline-block;padding:13px 26px;border-radius:99px;border:1px solid rgba(0,169,196,.5);color:var(--ink);background:rgba(0,169,196,.12);font-size:14px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.97)}
</style>
</head>
