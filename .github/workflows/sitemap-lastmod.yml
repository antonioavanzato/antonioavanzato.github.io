name: Актуализация дат в sitemap

on:
  push:
    branches: [main]
    paths:
      - '**.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-lastmod
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Пересчитать lastmod по истории коммитов
        run: python3 .github/scripts/update_lastmod.py

      - name: Закоммитить, если что-то изменилось
        run: |
          if [ -z "$(git status --porcelain sitemap.xml)" ]; then
            echo "изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "sitemap: актуализация lastmod [skip ci]"
          git push
